services:
  php:
    build: .
    container_name: banknote_php
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      BANKNOTE_HOST: ${BANKNOTE_HOST:-banknote.sundrunir.com}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - todo-list-mariadb_default
      - sundrunir-phase1_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sundrunir-phase1_internal"
      - "traefik.http.routers.banknote.rule=Host(`${BANKNOTE_HOST:-banknote.sundrunir.com}`)"
      - "traefik.http.routers.banknote.entrypoints=websecure"
      - "traefik.http.routers.banknote.tls=true"
      - "traefik.http.routers.banknote.tls.certresolver=le"
      - "traefik.http.services.banknote.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  todo-list-mariadb_default:
    external: true
  sundrunir-phase1_internal:
    external: true
